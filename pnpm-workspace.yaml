packages:
  - apps/*
  - packages/*

catalog:
  '@types/react': 19.3.0
  eslint: 9.39.5
  prettier: 3.9.10
  react: 19.3.0
  react-dom: 19.3.0
  typescript: 6.0.3
  zod: 4.6.7

savePrefix: ''
minimumReleaseAge: 1440

# NativeWind 5 RC compiles CSS with the lightningcss that @expo/metro-config resolves,
# and fails to deserialize its output on 1.33 (TECH-15).
overrides:
  '@expo/metro-config>lightningcss': 1.30.1

allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  cpu-features: false
  esbuild: false
  prisma: true
  protobufjs: false
  ssh2: false
  unrs-resolver: false

# react-native-css RC0 misses React Native 0.88's AssetRegistry export, so expo-asset (fonts,
# images) gets undefined. Drop once nativewind/react-native-css#504 is released (TECH-15).
patchedDependencies:
  react-native-css@3.1.0-rc.0: patches/react-native-css@3.1.0-rc.0.patch
